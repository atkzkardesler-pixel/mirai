[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirai"
version = "1.0.0"
description = "Kendi iradesine sahip, sürekli öğrenen, otonom AI ajan"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "atkzkardesler-pixel"}]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "transformers>=4.40",
    "accelerate>=0.30",
    "peft>=0.11",
    "trl>=0.9",
    "datasets>=2.19",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "gitpython>=3.1",
    "psutil>=5.9",
    "httpx>=0.27",
    "tenacity>=8.4",
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
    "pybullet>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
train = [
    "torch>=2.3",
    "transformers>=4.40",
    "accelerate>=0.30",
    "peft>=0.11",
    "trl>=0.9",
    "datasets>=2.19",
    "bitsandbytes>=0.43",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true